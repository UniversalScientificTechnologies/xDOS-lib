; Test project of the library itself - firmware projects do not use this file.
;
; Pure logic in src/ is built together with the Unity tests in test/ and runs
; on the PC:   pio test -e native
; Arduino glue (src/arduino/) needs the Arduino core and is left out here.
;
; xDOS-versions is expected next to this repository (../xDOS-versions), the
; same way the firmware projects keep both as sibling submodules.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<arduino/>
lib_deps = symlink://../xDOS-versions
; The AVR toolchain of the firmware projects is C++11 - keep the tests there too.
build_flags = -std=gnu++11 -Wall -Wextra
